name: StudentApp CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StudentApp
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test, and generate coverage
        run: mvn -B clean verify

      - name: SonarQube analysis and quality gate
        if: github.event_name != 'pull_request'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo "::error::Set the SONAR_HOST_URL repository secret."; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "::error::Set the SONAR_TOKEN repository secret."; exit 1; }
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=student-app \
            -Dsonar.qualitygate.wait=true

  docker-deploy:
    needs: build-test-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./StudentApp
          file: ./StudentApp/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studentapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studentapp:${{ github.sha }}

      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/studentapp:${{ github.sha }}
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: IMAGE,MYSQL_URL,MYSQL_USERNAME,MYSQL_PASSWORD
          script: |
            : "${MYSQL_URL:?Set the MYSQL_URL secret}"
            : "${MYSQL_USERNAME:?Set the MYSQL_USERNAME secret}"
            : "${MYSQL_PASSWORD:?Set the MYSQL_PASSWORD secret}"
            docker pull "$IMAGE"
            if docker container inspect studentapp >/dev/null 2>&1; then
              docker rm -f studentapp
            fi
            docker run -d \
              --name studentapp \
              --restart unless-stopped \
              -p 8080:8082 \
              -e MYSQL_URL \
              -e MYSQL_USERNAME \
              -e MYSQL_PASSWORD \
              "$IMAGE"
