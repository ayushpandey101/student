<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to the Student Management application">
    <title>Sign in | Student Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="login-card">
    <div class="login-brand">
        
        <span>Student Management</span>
    </div>

    <h1>Welcome back</h1>
    <p class="login-intro">Sign in to manage student registrations and course records.</p>

    <p class="login-message login-error"
       role="alert"
       th:if="${param.error}">
        Sign-in failed. Check your username and password and try again.
    </p>
    <p class="login-message login-success"
       role="status"
       th:if="${param.logout}">
        You have been signed out.
    </p>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label for="username">Username</label>
        <input id="username"
               name="username"
               type="text"
               autocomplete="username"
               maxlength="100"
               required
               autofocus>

        <label for="password">Password</label>
        <input id="password"
               name="password"
               type="password"
               autocomplete="current-password"
               required>

        <button class="primary-button" type="submit">Sign in</button>
    </form>

    <p class="login-alternate">
        New here? <a th:href="@{/signup}">Create an account</a>
    </p>
</main>
</body>
</html>
