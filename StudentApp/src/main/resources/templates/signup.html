<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a Student Management account">
    <title>Create account | Student Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="login-card">
    <div class="login-brand">
        
        <span>Student Management</span>
    </div>

    <h1>Create your account</h1>
    <p class="login-intro">Sign up to manage student registrations and course records.</p>

    <form th:action="@{/signup}" th:object="${signupForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label for="username">Username</label>
        <input id="username"
               th:field="*{username}"
               type="text"
               autocomplete="username"
               minlength="3"
               maxlength="30"
               pattern="[A-Za-z0-9._-]+"
               required
               autofocus>
        <p class="error"
           id="username-error"
           role="alert"
           th:if="${#fields.hasErrors('username')}"
           th:errors="*{username}"></p>

        <label for="email">Email</label>
        <input id="email"
               th:field="*{email}"
               type="email"
               autocomplete="email"
               maxlength="254"
               required>
        <p class="error"
           id="email-error"
           role="alert"
           th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>

        <label for="password">Password</label>
        <input id="password"
               name="password"
               type="password"
               autocomplete="new-password"
               minlength="12"
               maxlength="128"
               required>
        <p class="login-intro">Use at least 12 characters.</p>
        <p class="error"
           id="password-error"
           role="alert"
           th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"></p>

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword"
               name="confirmPassword"
               type="password"
               autocomplete="new-password"
               minlength="12"
               maxlength="128"
               required>
        <p class="error"
           id="confirm-password-error"
           role="alert"
           th:if="${#fields.hasErrors('confirmPassword')}"
           th:errors="*{confirmPassword}"></p>

        <button class="primary-button" type="submit">Create account</button>
    </form>

    <p class="login-alternate">
        Already have an account? <a th:href="@{/login}">Sign in</a>
    </p>
</main>
</body>
</html>
